name: Release

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="dist/keygrp-${os}-${arch}"
            mkdir -p "${dir}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "${dir}/kg" ./cmd/kg
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="-s -w" -o "${dir}/kgx" ./cmd/kgx
            tar -czf "dist/keygrp-${os}-${arch}.tar.gz" -C "${dir}" kg kgx
          done
          cd dist && sha256sum *.tar.gz > sha256sums.txt
      - name: Bump Homebrew formula
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git checkout main
          chmod +x hack/bump-formula.sh
          hack/bump-formula.sh "${GITHUB_REF_NAME#v}"
          git add Formula/keygrp.rb
          if git diff --cached --quiet; then
            echo "formula already current; nothing to commit"
          else
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(brew): bump formula to ${GITHUB_REF_NAME}"
            git push origin main
          fi
      - name: Attach assets to release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
